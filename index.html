<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075c38"><meta name="description" content="সহজ বাংলায় তাজবীদ শিক্ষা">
<link rel="manifest" href="manifest.json">
<title>তাজবীদ শিক্ষা</title>
<style>
:root{--green:#075c38;--gold:#e8b83f;--cream:#fff9e8;--ink:#183c2b}
*{box-sizing:border-box}body{margin:0;background:#f3f7f1;color:#173b2a;font-family:system-ui,"Noto Sans Bengali",sans-serif}
header{background:linear-gradient(140deg,#064629,#087548);color:white;text-align:center;padding:24px 16px 20px;border-bottom:5px solid var(--gold)}
header .crescent{font-size:38px}h1{margin:5px 0;font-size:30px}header p{margin:5px 0 0;color:#fbe9a7}
main{max-width:850px;margin:auto;padding:16px}.search{width:100%;padding:13px;border:1px solid #cbd8ce;border-radius:12px;font-size:16px;margin-bottom:14px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}nav button{border:1px solid #cbd8ce;background:white;color:var(--green);padding:9px 12px;border-radius:20px;font-weight:700}
nav button.active{background:var(--green);color:white}
.card{background:white;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 3px 12px #1231;border-left:4px solid var(--gold)}
.card h2{margin:0 0 8px;color:var(--green);font-size:21px}.arabic{font-size:25px;direction:rtl;color:#075c38;background:#f8f5e9;padding:10px;border-radius:9px;text-align:center;line-height:1.8}
.tag{display:inline-block;background:#e7f4eb;color:#075c38;padding:4px 9px;border-radius:20px;font-size:13px;font-weight:700}
small{color:#53675a}.footer{text-align:center;padding:20px;color:#65756b;font-size:13px}
</style>
</head>
<body>
<header><div class="crescent">☪</div><h1>তাজবীদ শিক্ষা</h1><p>সঠিক উচ্চারণে কুরআন তিলাওয়াত</p></header>
<main>
<input class="search" id="search" placeholder="বিষয় খুঁজুন… যেমন: মাদ্দ, ইখফা">
<nav id="tabs"></nav><section id="content"></section>
<div class="footer">শিক্ষামূলক সহায়িকা • সঠিক তিলাওয়াতের জন্য যোগ্য শিক্ষকের কাছে শুনে অনুশীলন করুন।</div>
</main>
<script>
const lessons=[
{cat:"মাদ্দ",title:"মাদ্দে আসলি (প্রাকৃতিক মাদ্দ)",def:"হরফে মাদ্দের পরে হামজা বা সুকুন না থাকলে স্বাভাবিকভাবে ২ হারাকাত টেনে পড়াকে মাদ্দে আসলি বলে।",ex:"قَالَ ، يَقُولُ",note:"উদাহরণে আলিফ/ওয়াও মাদ্দের ধ্বনি ২ হারাকাত পড়ুন।"},
{cat:"মাদ্দ",title:"মাদ্দে মুত্তাসিল",def:"একই শব্দে হরফে মাদ্দের পরে হামজা এলে তাকে মাদ্দে মুত্তাসিল বলে।",ex:"جَاءَ ، السَّمَاءِ",note:"পাঠপদ্ধতি ও রেওয়ায়েত অনুযায়ী টানের পরিমাণ শিখুন।"},
{cat:"মাদ্দ",title:"মাদ্দে মুনফাসিল",def:"এক শব্দের শেষে হরফে মাদ্দ এবং পরের শব্দের শুরুতে হামজা থাকলে মাদ্দে মুনফাসিল হয়।",ex:"إِنَّا أَعْطَيْنَاكَ",note:"নিজের শিক্ষকের অনুসৃত কিরাআত অনুযায়ী পড়ুন।"},
{cat:"মাখরাজ",title:"মাখরাজ কী?",def:"আরবি হরফ উচ্চারণের সময় যে স্থান থেকে ধ্বনি বের হয় তাকে মাখরাজ বলে।",ex:"ء ، ه ، ع ، ح ، غ ، خ",note:"প্রচলিত শিক্ষায় মাখরাজের প্রধান অঞ্চল: জওফ, হালক, জিহ্বা, ঠোঁট ও নাক।"},
{cat:"মাখরাজ",title:"হালকের মাখরাজ",def:"গলার বিভিন্ন স্থান থেকে ছয়টি হরফ উচ্চারিত হয়।",ex:"ء ه — ع ح — غ خ",note:"গলার গভীর, মধ্য ও মুখের কাছের অংশ আলাদা করে অনুশীলন করুন।"},
{cat:"সিফাত",title:"সিফাত কী?",def:"হরফ উচ্চারণের সময় তার সঙ্গে থাকা বৈশিষ্ট্যকে সিফাত বলে।",ex:"هَمْس / جَهْر ، شِدَّة / رَخَاوَة",note:"সিফাত সঠিকভাবে বুঝতে শিক্ষক/কারির উচ্চারণ শুনুন।"},
{cat:"সিফাত",title:"হামস ও জাহর",def:"হামসে উচ্চারণের সময় নিঃশ্বাস প্রবাহিত হয়; জাহরে নিঃশ্বাসের প্রবাহ বাধাপ্রাপ্ত হয়।",ex:"হামসের হরফ: ف ح ث ه ش خ ص س ك ت",note:"হরফগুলো মুখে উচ্চারণ করে পার্থক্য শুনুন।"},
{cat:"ওয়াকফ",title:"ওয়াকফ কী?",def:"তিলাওয়াতের সময় নির্দিষ্ট স্থানে শ্বাস নেওয়ার জন্য থামাকে ওয়াকফ বলে।",ex:"مـ = সাধারণত থামার নির্দেশ; لا = সাধারণত না থামার নির্দেশ",note:"মুশাফের চিহ্নের ব্যাখ্যা সংস্করণভেদে সামান্য ভিন্ন হতে পারে; শিক্ষকের নির্দেশ মানুন।"},
{cat:"ওয়াকফ",title:"ওয়াকফে তাম",def:"অর্থ ও বাক্যগঠন সম্পূর্ণ হওয়ার পর থামাকে ওয়াকফে তাম বলা হয়।",ex:"আয়াতের অর্থ সম্পূর্ণ হয়েছে এমন স্থানে",note:"কোথায় থামবেন তা অর্থ বুঝে ও শিক্ষকের নির্দেশে শিখুন।"},
{cat:"নুন সাকিন ও তানভীন",title:"ইযহার",def:"নুন সাকিন বা তানভীনের পরে حلقের ছয় হরফ ء ه ع ح غ خ এলে স্পষ্ট করে পড়াকে ইযহার বলে।",ex:"مِنْ هَادٍ ، عَلِيمٌ حَكِيمٌ",note:"নুনের ধ্বনি স্পষ্ট থাকবে, অতিরিক্ত গুননা নয়।"},
{cat:"নুন সাকিন ও তানভীন",title:"ইদগাম",def:"নুন সাকিন বা তানভীনের পরে ي ر م ل و ن এলে নির্দিষ্ট নিয়মে পরের হরফে মিলিয়ে পড়াকে ইদগাম বলে।",ex:"مَنْ يَعْمَلْ ، مِنْ رَبِّهِمْ",note:"ইদগাম বিল গুননা ও বিগুননা—দুই ধরন আলাদা করে শিখুন।"},
{cat:"নুন সাকিন ও তানভীন",title:"ইকলাব",def:"নুন সাকিন বা তানভীনের পরে ب এলে নুনের ধ্বনি মীমের কাছাকাছি করে গুননাসহ পড়াকে ইকলাব বলে।",ex:"مِنْ بَعْدِ",note:"মীমের মতো আড়াল করা ধ্বনি ও গুননা অনুশীলন করুন।"},
{cat:"নুন সাকিন ও তানভীন",title:"ইখফা",def:"নুন সাকিন বা তানভীনের পরে ইযহার, ইদগাম ও ইকলাবের হরফ ছাড়া বাকি ১৫ হরফ এলে নুনের ধ্বনি আড়াল করে গুননাসহ পড়াকে ইখফা বলে।",ex:"مِنْ قَبْلُ ، أَنْفُسَكُمْ",note:"জিহ্বা নুনের মাখরাজে পুরোপুরি লাগাবেন না; শিক্ষক শুনে সংশোধন করবেন।"}
];
const cats=["সব","মাদ্দ","মাখরাজ","সিফাত","ওয়াকফ","নুন সাকিন ও তানভীন"];let active="সব";
const tabs=document.getElementById('tabs'),content=document.getElementById('content'),search=document.getElementById('search');
function renderTabs(){tabs.innerHTML=cats.map(c=>`<button class="${active===c?'active':''}" data-cat="${c}">${c}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderTabs();render()})}
function render(){let q=search.value.trim().toLowerCase();let items=lessons.filter(x=>(active==="সব"||x.cat===active)&&(!q||(x.title+x.def+x.ex+x.cat).toLowerCase().includes(q)));content.innerHTML=items.length?items.map(x=>`<article class="card"><span class="tag">${x.cat}</span><h2>${x.title}</h2><p><b>সংজ্ঞা:</b> ${x.def}</p><div class="arabic" lang="ar">${x.ex}</div><p><b>উদাহরণ/অনুশীলন:</b> ${x.note}</p></article>`).join(''):'<article class="card">কোনো বিষয় পাওয়া যায়নি। অন্য শব্দ দিয়ে খুঁজুন।</article>'}
search.addEventListener('input',render);renderTabs();render();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
